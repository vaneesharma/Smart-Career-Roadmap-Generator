{% extends 'dashboard_base.html' %}
{% block page_title %}Change Password{% endblock %}
{% block dashboard_content %}
<div class="card" style="max-width:500px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group"><label>Old Password</label>{{ form.old_password }}</div>
        <div class="form-group"><label>New Password</label>{{ form.new_password1 }}</div>
        <div class="form-group"><label>Confirm New Password</label>{{ form.new_password2 }}</div>
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
</div>
{% endblock %}
