{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        {% if validlink %}
        <h2>Set New Password</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>New Password</label>{{ form.new_password1 }}</div>
            <div class="form-group"><label>Confirm New Password</label>{{ form.new_password2 }}</div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Reset Password</button>
        </form>
        {% else %}
        <h2>Link Expired</h2>
        <p class="subtitle">This password reset link is invalid or has already been used.</p>
        <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary">Request New Link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
